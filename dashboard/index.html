<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftBot Dashboard</title>
    <script>
      // Pre-paint theme to avoid flash; must match initialTheme() in src/ThemeContext.jsx
      try {
        var t = localStorage.getItem('shiftbot-theme');
        if (t === 'dark' || (t !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
